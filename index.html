<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f2ed">
  <title>Extintor clase A</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="Js/index.js" defer></script>
</head>
<body>
  <main class="page">
    <article class="sign" aria-labelledby="sign-title">
      <header class="sign__header">
        <h1 id="sign-title">EXTINTOR</h1>
      </header>

      <p class="sign__subtitle">ÚSELO ÚNICAMENTE EN FUEGO CLASE</p>

      <section class="fire-class" aria-label="Clase A: sólidos combustibles">
        <div class="fire-class__letter" aria-hidden="true">A</div>

        <div class="fire-class__pictogram">
          <img
            src="img/Captura%20de%20pantalla%202026-10-08%20104134.png"
            alt="Símbolo de extintor para sólidos combustibles"
          >
        </div>

        <p class="fire-class__description">
          SÓLIDOS COMBUSTIBLES<br>
          <strong>madera, papel,<br>tela, basura<br>cartones</strong>
        </p>
      </section>

      <section class="instructions" aria-labelledby="instructions-title">
        <h2 id="instructions-title">MÉTODO PARA UTILIZARLO</h2>
        <ol>
          <li>Sosténgalo en posición vertical.</li>
          <li>Retire el seguro.</li>
          <li>Oprima la palanca.</li>
          <li>Dirija la descarga contra la base de la llama.</li>
        </ol>
      </section>

      <div class="bottom-bar" aria-hidden="true">
        <span class="bottom-bar__stripe" aria-hidden="true"></span>
        <span class="bottom-bar__stripe" aria-hidden="true"></span>
        <span class="bottom-bar__stripe" aria-hidden="true"></span>
      </div>
      <audio id="pictogram-sound" src="mp3/u_g0akwz8ml1-fuego-194492.mp3" preload="auto"></audio>
    </article>
  </main>
</body>
</html>
